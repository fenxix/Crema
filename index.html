            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        .luma-mark {
            display: inline-block; flex: none; aspect-ratio: 520 / 450;
            background-color: currentColor;
            -webkit-mask: var(--luma-icon) center / contain no-repeat;
            mask: var(--luma-icon) center / contain no-repeat;
        }

        /* ===== Экран приветствия =====
           Все размеры — в долях ширины макета (1024 px): --u = ширина экрана / 1024 */
        .wl {
            --sw: 100vw; --u: calc(var(--sw) / 1024);
            position: fixed; inset: 0; z-index: 200;
            display: flex; justify-content: center;
            background: #060606; color: #fff; overflow: hidden;
            font-family: 'Manrope', 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: opacity .45s ease, visibility .45s;
        }
        @media (min-aspect-ratio: 2/3) { .wl { --sw: 66.6667vh; } }
        @supports (height: 100dvh) { @media (min-aspect-ratio: 2/3) { .wl { --sw: 66.6667dvh; } } }
        .wl.out { opacity: 0; visibility: hidden; pointer-events: none; }
        .wl * { transition: none; box-sizing: border-box; }

        .wl-stage {
            position: relative; width: var(--sw); height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: calc(var(--u) * 175) 0 calc(var(--u) * 88 + env(safe-area-inset-bottom, 0px));
        }

        /* фон: приглушённый свет, блик справа сверху, свечение пола */
        .wl-bg {
            position: absolute; inset: 0; pointer-events: none;
            background:
                radial-gradient(70% 13% at 50% 80%, rgba(42, 49, 70, .50), transparent 72%),
                radial-gradient(48% 20% at 100% 5%, rgba(255, 255, 255, .06), transparent 72%),
                radial-gradient(60% 10% at 50% 71%, rgba(60, 66, 82, .28), transparent 75%),
                #070707;
        }
        .wl-streak {
            position: absolute; left: calc(var(--u) * -40); bottom: calc(var(--u) * 150);
            width: calc(var(--u) * 310); height: calc(var(--u) * 38);
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.17) 55%, rgba(255,255,255,.04));
            transform: rotate(17deg); filter: blur(7px); pointer-events: none;
        }
        .wl-block {
            position: absolute; left: 0; bottom: 0; width: calc(var(--u) * 250); height: calc(var(--u) * 120);
            background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.55)); pointer-events: none;
        }

        /* КАЗПОТРЕБСОЮЗ справа сверху */
        .wl-top {
            position: absolute; top: calc(var(--u) * 63); right: calc(var(--u) * 66);
            display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u) * 17);
        }
        .wl-top i { display: block; width: calc(var(--u) * 50); height: max(1.5px, calc(var(--u) * 2.4)); background: rgba(150,153,162,.55); }
        .wl-top span { font-size: max(calc(var(--u) * 15), 9px); line-height: 1; letter-spacing: .1em; font-weight: 500; color: #74767E; }

        /* лого + название + заголовок */
        .wl-hero { position: relative; display: flex; flex-direction: column; align-items: center; }
        .wl-logo { width: calc(var(--u) * 158); color: #F4F5F7; filter: drop-shadow(0 0 calc(var(--u) * 14) rgba(255,255,255,.16)); }
        .wl-word {
            margin-top: calc(var(--u) * 25); width: calc(var(--u) * 256);
            display: flex; justify-content: space-between;
            font-size: calc(var(--u) * 43); line-height: 1; font-weight: 500; color: #FBFBFB;
        }
        .wl-h {
            margin: calc(var(--u) * 78) 0 0; text-align: center; font-weight: 500;
            font-size: calc(var(--u) * 62); line-height: 1.097; letter-spacing: -.012em; color: #fff;
        }
        .wl-g {
            display: inline-block;
            background: linear-gradient(90deg, #fff 0%, #F1F4FA 42%, #B2BADB 68%, #9AA4D3 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }
        .wl-sub {
            margin: calc(var(--u) * 30) 0 0; text-align: center; font-weight: 400;
            font-size: max(calc(var(--u) * 26), 12.5px); line-height: 1.31; color: #B6BFCE;
        }

        /* арт: стеклянная плитка, орбита, малые плитки */
        .wl-artwrap { position: relative; flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
        .wl-art { position: relative; flex: none; width: calc(var(--u) * 1024); height: calc(var(--u) * 410); transform: translateY(calc(var(--u) * -28)); }
        .wl-ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
        .wl-ring.back { z-index: 0; }
        .wl-ring.front { z-index: 3; }
        .wl-floor {
            position: absolute; z-index: 0; left: calc(var(--u) * 200); top: calc(var(--u) * 372);
            width: calc(var(--u) * 640); height: calc(var(--u) * 110);
            background: radial-gradient(ellipse at 50% 22%, rgba(175,190,232,.36), rgba(175,190,232,0) 68%);
            filter: blur(6px);
        }
        .wl-edge { position: absolute; z-index: 0; left: 0; top: calc(var(--u) * 250); width: calc(var(--u) * 120); height: max(1px, calc(var(--u) * 2)); background: linear-gradient(90deg, rgba(255,255,255,.14), rgba(255,255,255,0)); }

        .wl-tile {
            position: absolute; z-index: 1;
            left: calc((var(--x) - var(--s) / 2) * var(--u));
            top: calc((var(--y) - 735 - var(--s) / 2) * var(--u));
            width: calc(var(--s) * var(--u)); height: calc(var(--s) * var(--u));
            border-radius: calc(var(--s) * var(--u) * .22);
            transform: rotate(var(--r));
            display: flex; align-items: center; justify-content: center;
            color: #E9ECF2;
            background:
                radial-gradient(120% 120% at 88% 6%, rgba(118,142,205,.30), rgba(118,142,205,0) 56%),
                linear-gradient(150deg, #2B2D33, #131417 72%);
            box-shadow:
                0 0 calc(var(--u) * 30) rgba(150,170,225,.12),

async function pseudoEmail(f, l, g) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(norm(l) + '|' + norm(f) + '|' + norm(g)));
    return [...new Uint8Array(b)].slice(0, 12).map(x => x.toString(16).padStart(2, '0')).join('') + '@gmail.com';
}

    .map(x => ({ n: x.pair_no, time: `${String(x.start_time).slice(0, 5)} - ${String(x.end_time).slice(0, 5)}`, subject: x.subject, room: x.room || '', type: x.type || '', teacher: x.teacher || '' }));
async function loadSchedule() {
    const { data } = await sb.from('schedule').select('*').eq('group_name', me.p.group_name);
    me.sch = data || [];
    state.studentSchedule = lessons(todayWd());
    const subj = new Map(); me.sch.forEach(x => subj.has(x.subject) || subj.set(x.subject, x.teacher || ''));
    state.studentGrades = [...subj].map(([subject, teacher]) => ({ subject, teacher, currentScore: '—', quarterGrade: '—', status: 'Нет оценок' }));
}
const lcard = x => `<div class="p-4 rounded-xl ${C.sub} flex items-center justify-between gap-3"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-xl bg-[#6366F1]/10 text-[#6366F1] flex flex-col items-center justify-center shrink-0 leading-none"><span class="text-base font-bold">${x.n}</span><span class="text-[9px] mt-0.5">пара</span></div><div><p class="text-xs font-semibold text-[#6366F1]">${esc(x.time)}</p><h4 class="font-bold text-base">${esc(x.subject)}</h4><p class="text-xs ${C.mut}">${esc([x.teacher, x.type].filter(Boolean).join(' • '))}</p></div></div>${x.room ? `<span class="px-3 py-1.5 rounded-lg bg-white dark:bg-[#111111] border border-[#E7E7E5] dark:border-[#292929] text-xs font-semibold">${esc(x.room)}</span>` : ''}</div>`;
studentSchedule = function () {
    const wd = me.wd || todayWd(), L = lessons(wd), on = 'bg-[#111111] dark:bg-white text-white dark:text-[#111111] border-transparent';
    return `<div class="space-y-6 animate-fadeIn">${hdr('Расписание занятий', `Группа ${esc(me.p?.group_name)} • Казпотребсоюз`)}
    <div class="flex flex-wrap gap-2">${WD.map((d, i) => `<button onclick="me.wd=${i + 1};renderContent()" class="px-4 py-2 rounded-xl text-sm font-semibold border ${wd === i + 1 ? on : 'border-[#E7E7E5] dark:border-[#292929] ' + C.mut}">${d}${i + 1 === todayWd() ? ' •' : ''}</button>`).join('')}</div>
    <div class="${C.card} space-y-3"><h3 class="font-bold text-base text-[#6366F1]">${WDF[wd - 1]}${wd === todayWd() ? ' — сегодня' : ''}</h3>${L.length ? L.map(lcard).join('') : `<p class="text-sm ${C.mut}">Пар нет</p>`}</div></div>`;
};

// --- AI и задания: заглушки ---
renderAIStateContent = () => `<div class="p-5 rounded-xl ${C.sub} text-center space-y-1"><p class="font-semibold text-sm">AI-помощник временно недоступен</p><p class="text-xs ${C.mut}">Скоро вернётся</p></div>`;
renderStudentAssignmentsView = () => `<div class="space-y-6 animate-fadeIn">${hdr('Задания и проекты', 'Пока заданий нет')}</div>`;

// --- чат группы ---
const chatView = () => `<div class="space-y-4 animate-fadeIn">${hdr('Чат группы ' + esc(me.p.group_name), 'Сообщения видят только студенты вашей группы')}<div class="${C.card} !p-3 space-y-3"><div id="msgs" class="h-[55vh] overflow-y-auto space-y-2 px-1"></div><div class="flex gap-2"><input id="msg-in" maxlength="1000" placeholder="Сообщение…" onkeydown="if(event.key==='Enter')sendMsg()" class="${C.inp} flex-1 !py-3 !text-sm"><button onclick="sendMsg()" class="${C.btn}">Отправить</button></div></div></div>`;
function paintMsgs() {
    const b = $('msgs'); if (!b) return;
    b.innerHTML = me.msgs.length ? me.msgs.map(m => { const my = m.user_id === me.p.id; return `<div class="flex ${my ? 'justify-end' : ''}"><div class="max-w-[85%] px-3.5 py-2 rounded-2xl ${my ? 'bg-[#111111] dark:bg-white text-white dark:text-[#111111]' : C.sub}"><p class="text-[11px] font-semibold ${my ? 'opacity-70' : 'text-[#6366F1]'}">${my ? 'Вы' : esc(m.author)} · ${new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</p><p class="text-sm whitespace-pre-wrap break-words">${esc(m.body)}</p></div></div>`; }).join('') : `<p class="text-sm text-center py-10 ${C.mut}">Сообщений пока нет — напишите первым</p>`;
    b.scrollTop = b.scrollHeight;
}
const addMsg = m => { if (!me.msgs.some(x => x.id === m.id)) { me.msgs.push(m); paintMsgs(); } };
async function openChat() {
    const { data } = await sb.from('messages').select('*').eq('group_name', me.p.group_name).order('created_at', { ascending: false }).limit(100);
    me.msgs = (data || []).reverse(); paintMsgs();
    if (!me.ch) me.ch = sb.channel('chat-' + me.p.id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => { if (p.new.group_name === me.p.group_name) addMsg(p.new); }).subscribe();
}
async function sendMsg() {
    const i = $('msg-in'), t = i.value.trim(); if (!t) return; i.value = '';
    const { data, error } = await sb.from('messages').insert({ group_name: me.p.group_name, body: t }).select().single();
    if (error) { i.value = t; return showToast('Не отправлено'); }
    addMsg(data);
}
const _rc = renderContent;
renderContent = function () {
    if (me.p && state.role === 'student' && state.currentTab === 'chat') { $('main-content').innerHTML = chatView(); openChat(); }
    else _rc();
};

// --- старт ---
(async () => {
    const { data } = await sb.from('groups').select('name').order('name');
    me.groups = (data || []).map(x => x.name);
    auRender(); await boot();
})();
</script>

</body>
</html>
